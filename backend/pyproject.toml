[project]
name = "noor-safar-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "openai==1.59.7",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "websockets==14.1",
    "python-multipart==0.0.20",
    "indic-transliteration==2.3.82",
    "edge-tts==7.2.8",
    # Screenshot verse-finder fuzzy matching (quran_identify.py) — pure-Python
    # fallback wheel available, no numpy-style heavy-import risk.
    "rapidfuzz==3.14.5",
    # Per-IP rate limiting on endpoints that call a paid external API.
    "slowapi==0.1.10",
    # Khutba PDF export. uharfbuzz shapes Arabic/Urdu for fpdf2; without it the
    # script renders as disconnected glyphs in reverse order.
    "fpdf2==2.8.8",
    "uharfbuzz==0.56.0",
]

[tool.vercel]
entrypoint = "app.main:app"
